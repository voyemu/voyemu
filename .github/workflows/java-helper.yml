# Java helper of preparation. A tag java-helper-<sha8> builds java-helper.zip, the helper JAR with its pinned
# libraries, twice with src/prepare/JavaHelperBuild.java on the pinned JDK, checks it against the javaHelper pin in
# src/app/toolchain.json and publishes it as the release asset that preparation downloads.
name: java-helper

on:
    push:
        tags: ["java-helper-*"]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: Build ${{ github.ref_name }}
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        outputs:
            tag: ${{ steps.select.outputs.tag }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Check selection fixtures
              run: bash src/dev/ci/java-helper-select.test.sh
            - name: Select the pinned helper
              id: select
              run: bash src/dev/ci/java-helper-select.sh .local/build/java-helper/SHA256SUMS
            # Restores or installs the JDK of the linux set and, as source-fixture inputs, the pinned Maven
            # libraries, build tools and platform JAR.
            - uses: ./.github/actions/toolchains
              with:
                  set: linux
                  fixture-inputs: 'true'
            - name: Build the helper twice
              run: |
                  out="$PWD/.local/build/java-helper"
                  javac --release 25 -d "$out/recipe" src/prepare/java/com/voyemu/prepare/Json.java \
                      src/prepare/JavaHelperBuild.java
                  for copy in asset repeat; do
                      java -cp "$out/recipe" com.voyemu.prepare.JavaHelperBuild asset "$PWD" \
                          "$PWD/.local/toolchains/java/libraries" "$out/$copy"
                  done
                  diff -r "$out/asset" "$out/repeat"
            - name: Check the helper against the pin
              run: |
                  cd .local/build/java-helper
                  (cd asset && sha256sum -c ../SHA256SUMS)
                  test "$(find asset -type f | wc -l)" -eq "$(wc -l < SHA256SUMS)"
                  cp SHA256SUMS asset/
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ steps.select.outputs.tag }}
                  path: .local/build/java-helper/asset/
                  if-no-files-found: error

    release:
        name: Release ${{ needs.build.outputs.tag }}
        needs: build
        if: github.ref_type == 'tag'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: ${{ needs.build.outputs.tag }}
                  path: asset
            - name: Create the release with the helper
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.build.outputs.tag }}
              run: |
                  gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
                      --notes "Java helper of preparation built at $GITHUB_SHA by src/prepare/JavaHelperBuild.java with javac of the pinned JDK from src/prepare/java and the Maven libraries pinned in src/prepare/libraries.json; no OEM input. java-helper.zip holds voyemu-java-helper.jar, build-receipt.json and lib/ without d8.jar and apksigner.jar, which preparation takes from the pinned build tools." \
                      asset/*

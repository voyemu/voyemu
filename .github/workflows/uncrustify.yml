# Reproducible Uncrustify binaries for the formatter. A tag uncrustify-<version>-<sha8> builds the
# linux-x64, darwin-arm64 and win32-x64 binaries twice, checks them against the pins in
# src/app/toolchain.json and publishes them as the release assets src/dev/format/uncrustify.cmake downloads.
name: uncrustify

on:
    push:
        tags: ["uncrustify-*"]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: Build ${{ github.ref_name }}
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        outputs:
            tag: ${{ steps.select.outputs.tag }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Check selection fixtures
              run: bash src/dev/ci/uncrustify-select.test.sh
            - name: Select the pinned binaries
              id: select
              run: bash src/dev/ci/uncrustify-select.sh .local/build/uncrustify/SHA256SUMS
            # Restores or installs Zig, CMake, Ninja and the Uncrustify source tarball.
            - uses: ./.github/actions/toolchains
              with:
                  set: uncrustify
            - name: Build every binary twice
              env:
                  VERSION: ${{ steps.select.outputs.version }}
              run: |
                  # The upstream build generates its option tables with the Python 3 of the runner.
                  python3 --version
                  out=.local/build/uncrustify
                  while read -r _ file; do
                      target=${file#"uncrustify-$VERSION-"}
                      target=${target%.exe}
                      # Each build runs in its own randomly named directory.
                      for copy in asset repeat; do
                          cmake -DVOYEMU_UNCRUSTIFY_TARGET="$target" -DVOYEMU_UNCRUSTIFY_OUTPUT="$PWD/$out/$copy/$file" \
                              -P src/dev/format/uncrustify.cmake
                      done
                      cmp "$out/asset/$file" "$out/repeat/$file"
                  done < "$out/SHA256SUMS"
            - name: Check the binaries against the pins
              run: |
                  cd .local/build/uncrustify
                  (cd asset && sha256sum -c ../SHA256SUMS)
                  cp SHA256SUMS asset/
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ steps.select.outputs.tag }}
                  path: .local/build/uncrustify/asset/
                  if-no-files-found: error

    release:
        name: Release ${{ needs.build.outputs.tag }}
        needs: build
        if: github.ref_type == 'tag'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: ${{ needs.build.outputs.tag }}
                  path: asset
            - name: Create the release with the binaries
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.build.outputs.tag }}
              run: |
                  gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
                      --notes "Reproducible Uncrustify binaries built at $GITHUB_SHA by src/dev/format/uncrustify.cmake from the pinned upstream release tarball with the pinned Zig." \
                      asset/*

# Verify reproducibility on demand. A resource tag dispatch reuses a checked archive
# from a successful producer run or builds once against the published recipe pin.
name: qnx-host

on:
    workflow_dispatch:
        inputs:
            host:
                description: Engine to build
                type: choice
                options: [macos-arm64, linux-x64, windows-x64]
            reproducible:
                description: Build twice in different roots and compare (branch only)
                type: boolean
                default: false
            verified_run:
                description: Successful reproducibility run to reuse (resource tag only)
                type: string

permissions:
    contents: read

jobs:
    select:
        name: Select ${{ github.event.inputs.host || github.ref_name }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            host: ${{ steps.select.outputs.host }}
            runner: ${{ steps.select.outputs.runner }}
            set: ${{ steps.select.outputs.set }}
            fixtures: ${{ steps.select.outputs.fixtures }}
            toolchain: ${{ steps.select.outputs.toolchain }}
            test: ${{ steps.select.outputs.test }}
            asset: ${{ steps.select.outputs.asset }}
            sha: ${{ steps.select.outputs.sha }}
            tag: ${{ steps.select.outputs.tag }}
            commit: ${{ github.sha }}
            reproducible: ${{ steps.select.outputs.reproducible }}
            verified_run: ${{ steps.select.outputs.verified_run }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ github.sha }}
            - name: Check selection and reuse fixtures
              run: |
                  bash src/dev/ci/qnx-host-select.test.sh
                  bash src/dev/ci/qnx-host-reuse.test.sh
            - name: Select the engine and its prebuilt pin
              id: select
              env:
                  INPUT_HOST: ${{ inputs.host }}
                  REPRODUCIBLE: ${{ inputs.reproducible }}
                  VERIFIED_RUN: ${{ inputs.verified_run }}
              run: bash src/dev/ci/qnx-host-select.sh

    reuse:
        name: Retrieve verified ${{ needs.select.outputs.host }} archive
        needs: select
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            actions: read
            contents: read
        outputs:
            reused: ${{ steps.retrieve.outputs.reused }}
        steps:
            - if: needs.select.outputs.verified_run != ''
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ needs.select.outputs.commit }}
            - name: Verify producer and download archive
              id: retrieve
              env:
                  GH_TOKEN: ${{ secrets.QNX_ARTIFACT_READ_TOKEN || secrets.GITHUB_TOKEN }}
                  PRODUCER_REPO: ${{ secrets.QNX_ARTIFACT_READ_TOKEN != '' && 'voyemu/voyemu' || github.repository }}
                  VERIFIED_RUN: ${{ needs.select.outputs.verified_run }}
                  HOST: ${{ needs.select.outputs.host }}
                  ASSET: ${{ needs.select.outputs.asset }}
                  PIN: ${{ needs.select.outputs.sha }}
                  COMMIT: ${{ needs.select.outputs.commit }}
              run: |
                  if [[ -z "$VERIFIED_RUN" ]]; then
                      echo "reused=false" >> "$GITHUB_OUTPUT"
                  else
                      bash src/dev/ci/qnx-host-reuse.sh "$VERIFIED_RUN" "$HOST" "$ASSET" "$PIN" "$COMMIT" out "$PRODUCER_REPO"
                  fi
            - if: steps.retrieve.outputs.reused == 'true'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ needs.select.outputs.tag }}-asset
                  path: |
                      out/${{ needs.select.outputs.asset }}
                      out/build.json
                  if-no-files-found: error

    sources:
        name: Sources ${{ needs.select.outputs.host }}
        needs: select
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ needs.select.outputs.commit }}
            - name: Check source companion fixtures
              run: bash src/dev/ci/qnx-host-sources.test.sh
            - name: Pack the source companion from the frozen snapshot
              env:
                  QNX_SOURCE_DOWNLOAD: "1"
                  HOST: ${{ needs.select.outputs.host }}
                  COMMIT: ${{ needs.select.outputs.commit }}
              run: bash src/dev/ci/qnx-host-sources.sh "$HOST" "$COMMIT" .local/build/qnx-host/sources
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ needs.select.outputs.tag }}-sources
                  path: .local/build/qnx-host/sources/
                  if-no-files-found: error

    build:
        name: Build ${{ needs.select.outputs.host }} (${{ matrix.copy }})
        needs: [select, reuse]
        if: needs.reuse.outputs.reused == 'false'
        strategy:
            fail-fast: false
            matrix:
                copy: ${{ fromJSON(needs.select.outputs.reproducible == 'true' && '["asset","repeat"]' || '["asset"]') }}
        runs-on: ${{ needs.select.outputs.runner }}
        timeout-minutes: 180
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ needs.select.outputs.commit }}
            # The ci sets of the runner: Zig, CMake, Ninja and the JDK, and on macOS and Linux the SDK CMake
            # whose Ninja the recipe runs.
            - uses: ./.github/actions/toolchains
              with:
                  set: ${{ needs.select.outputs.set }}
                  fixture-inputs: ${{ needs.select.outputs.fixtures }}
            - if: runner.os == 'macOS'
              run: sudo xcode-select --switch /Library/Developer/CommandLineTools
            - name: Build the recipe runner
              run: |
                  cmake -S src/app -B .local/build/qnx-host -G Ninja -DCMAKE_TOOLCHAIN_FILE="$PWD/src/dev/toolchains/${{ needs.select.outputs.toolchain }}.cmake" -DBUILD_TESTING=ON -DVOYEMU_BUILD_GRAPHICS=OFF
                  cmake --build .local/build/qnx-host --target ${{ needs.select.outputs.test }} --parallel 3
            # Each copy builds in its own project root outside the workspace, so the toolchain cache never
            # takes in the build, and the two roots differ in path and depth.
            - name: Build the engine from the recipe
              env:
                  COPY: ${{ matrix.copy }}
              run: |
                  temp=$RUNNER_TEMP
                  if [[ "$RUNNER_OS" == Windows ]]; then
                      temp=$(cygpath -u "$RUNNER_TEMP")
                  fi
                  # Short roots keep the Windows build paths within MAX_PATH.
                  if [[ "$COPY" == asset ]]; then
                      root="$temp/a/voyemu"
                  else
                      root="$temp/rp/b/voyemu"
                  fi
                  if [[ "$RUNNER_OS" == Windows ]]; then
                      root=${root%/voyemu}
                  fi
                  mkdir -p "$root" .local/build/qnx-host/out
                  if [[ "$RUNNER_OS" == Windows ]]; then
                      printf 'QNX_BUILD_ROOT=%s\n' "$(cygpath -m "$root")" >> "$GITHUB_ENV"
                  fi
                  git archive HEAD | tar -x -C "$root"
                  if [[ "$RUNNER_OS" != Windows ]]; then
                      mkdir -p "$root/.local/toolchains/native-sdk"
                      cp -R .local/toolchains/native-sdk/cmake "$root/.local/toolchains/native-sdk/"
                      root=$(cd "$root" && pwd -P)
                      out="$PWD/.local/build/qnx-host/out/${{ needs.select.outputs.asset }}"
                      .local/build/qnx-host/qnx_host_test --source-root "$root" "$out"
                  else
                      out=$(cygpath -w "$PWD/.local/build/qnx-host/out/${{ needs.select.outputs.asset }}")
                      .local/build/qnx-host/qnx_host_windows_test.exe --source-root "$(cygpath -w "$root")" "$out"
                  fi
            - name: Retain Windows source diagnostics
              if: failure() && runner.os == 'Windows' && env.QNX_BUILD_ROOT != ''
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: qnx-host-windows-x64-${{ matrix.copy }}-diagnostics
                  path: ${{ env.QNX_BUILD_ROOT }}/.local/build/qnx-windows-source-*/*
                  if-no-files-found: ignore
                  retention-days: 7
            # The macOS recipe uses the compiler and Python of the runner, the Linux recipe its Python and make;
            # the Windows recipe pins all its tools.
            - name: Record the build
              run: |
                  out=.local/build/qnx-host/out
                  asset=${{ needs.select.outputs.asset }}
                  if [[ "$RUNNER_OS" == macOS ]]; then
                      sha=$(shasum -a 256 "$out/$asset" | cut -d' ' -f1)
                      tools="\"macOS $(sw_vers --productVersion)\", \"$(xcrun clang --version | sed -n 1p)\", \"$(/usr/bin/python3 --version)\""
                  elif [[ "$RUNNER_OS" == Linux ]]; then
                      sha=$(sha256sum "$out/$asset" | cut -d' ' -f1)
                      tools="\"$(/usr/bin/python3 --version)\", \"$(/usr/bin/make --version | sed -n 1p)\""
                  else
                      sha=$(sha256sum "$out/$asset" | cut -d' ' -f1)
                      tools=
                  fi
                  printf '{"schema": 1, "commit": "%s", "runner": "%s %s", "tools": [%s], "asset": "%s", "sha256": "%s"}\n' \
                      "$GITHUB_SHA" "$ImageOS" "$ImageVersion" "$tools" "$asset" "$sha" > "$out/build.json"
                  cat "$out/build.json"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ needs.select.outputs.tag }}-${{ matrix.copy }}
                  path: .local/build/qnx-host/out/
                  if-no-files-found: error

    check:
        name: Check ${{ needs.select.outputs.tag }}
        needs: [select, reuse, build, sources]
        if: >-
            ${{ !cancelled() && needs.select.result == 'success' && needs.reuse.result == 'success' &&
                needs.sources.result == 'success' && (needs.build.result == 'success' ||
                (needs.reuse.outputs.reused == 'true' && needs.build.result == 'skipped')) }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ needs.select.outputs.commit }}
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: ${{ needs.select.outputs.tag }}-asset
                  path: asset
            - if: needs.select.outputs.reproducible == 'true'
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: ${{ needs.select.outputs.tag }}-repeat
                  path: repeat
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: ${{ needs.select.outputs.tag }}-sources
                  path: asset
            - name: Verify the source companion
              env:
                  HOST: ${{ needs.select.outputs.host }}
              run: cd asset && sha256sum -c "qnx-host-$HOST-sources.tar.sha256"
            - name: Verify the engine archive and the pin
              env:
                  ASSET: ${{ needs.select.outputs.asset }}
                  PIN: ${{ needs.select.outputs.sha }}
                  HOST: ${{ needs.select.outputs.host }}
                  REPRODUCIBLE: ${{ needs.select.outputs.reproducible }}
              run: |
                  if [[ "$REPRODUCIBLE" == true ]]; then
                      cmp "asset/$ASSET" "repeat/$ASSET" || { echo "The two builds differ" >&2; exit 1; }
                  fi
                  built=$(sha256sum "asset/$ASSET" | cut -d' ' -f1)
                  echo "Verified $ASSET $built; pin ${PIN:-pending}"
                  if [[ -z "$PIN" ]]; then
                      echo "Pin https://github.com/voyemu/voyemu-deps/releases/download/qnx-host-$HOST-${built:0:8}/$ASSET with SHA-256 $built" >> "$GITHUB_STEP_SUMMARY"
                  else
                      [[ "$built" == "$PIN" ]] || { echo "Built asset differs from the prebuilt pin" >&2; exit 1; }
                  fi
                  if [[ "$HOST" == windows-x64 && -n "$PIN" ]]; then
                      engine=qemu-system-aarch64.exe
                      expected=$(jq -er --arg file "$engine" '.windows_file_backend.verified_runtime.files[$file] |
                          [.sha256, (.bytes | tostring)] | @tsv' src/app/qnx-host.json)
                      read -r sha bytes <<< "$expected"
                      [[ $(unzip -p "asset/$ASSET" "$engine" | sha256sum | cut -d' ' -f1) == "$sha" ]]
                      [[ $(unzip -p "asset/$ASSET" "$engine" | wc -c) -eq "$bytes" ]]
                      [[ $(jq -er '.windows_file_backend.verified_runtime.qnx_file_backend.engine_sha256' src/app/qnx-host.json) == "$sha" ]]
                  fi
                  if [[ "$REPRODUCIBLE" == true ]]; then
                      jq -n --arg commit "$GITHUB_SHA" --arg host "$HOST" --arg sha "$built" \
                          '{schema: 1, commit: $commit, host: $host, sha256: $sha, reproducible: true}' > asset/verification.json
                  fi
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ needs.select.outputs.tag }}
                  path: asset/
                  if-no-files-found: error

    release:
        name: Release ${{ needs.select.outputs.tag }}
        needs: [select, check]
        if: github.repository == 'voyemu/voyemu-deps' && github.ref_type == 'tag'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: ${{ needs.select.outputs.tag }}
                  path: asset
            - name: Create the release with the engine
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.select.outputs.tag }}
              run: |
                  producer=$(jq -er '.commit | select(test("^[0-9a-f]{40}$"))' asset/build.json)
                  gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false --title "$TAG" \
                      --notes "QNX engine built at $producer from the recipe in src/app/qnx-host.json: QEMU 11.1.2 with the patches of the repository; licenses and SOURCE-INFO.txt inside the binary archive; source companion and its checksum beside it, build instructions inside the source companion, build record in build.json." \
                      asset/*
